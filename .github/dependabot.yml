# Hält Werkzeuge und Actions aktuell: einmal im Monat ein gesammelter Vorschlag je Bereich.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      werkzeuge:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
